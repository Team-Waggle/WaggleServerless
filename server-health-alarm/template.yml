AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: EC2 server health CloudWatch alarm to Discord

Parameters:
  DiscordWebhookUrl:
    Type: String
    NoEcho: true
    Description: Discord Webhook URL

  InstanceId:
    Type: String
    Description: EC2 instance ID to monitor

  DiscordMentionRoleId:
    Type: String
    Description: Discord role ID to mention

  CpuThreshold:
    Type: Number
    Default: 80
    Description: CPU utilization threshold (%)

  EvaluationPeriods:
    Type: Number
    Default: 3
    Description: Number of consecutive breaches

  Period:
    Type: Number
    Default: 300
    Description: Evaluation period in seconds

Resources:
  AlarmSnsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: waggle-server-health-alarm

  ServerHealthAlarmFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: waggle-server-health-alarm
      Handler: index.handler
      Runtime: nodejs22.x
      Timeout: 30
      CodeUri: src/
      Environment:
        Variables:
          DISCORD_WEBHOOK_URL: !Ref DiscordWebhookUrl
          DISCORD_MENTION_ROLE_ID: !Ref DiscordMentionRoleId
      Events:
        SnsEvent:
          Type: SNS
          Properties:
            Topic: !Ref AlarmSnsTopic
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        EntryPoints:
          - index.ts

  CpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: waggle-ec2-cpu-high
      AlarmDescription: !Sub "EC2 CPU utilization exceeded ${CpuThreshold}% for ${EvaluationPeriods} consecutive periods"
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Statistic: Average
      Period: !Ref Period
      EvaluationPeriods: !Ref EvaluationPeriods
      Threshold: !Ref CpuThreshold
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: InstanceId
          Value: !Ref InstanceId
      AlarmActions:
        - !Ref AlarmSnsTopic
      OKActions:
        - !Ref AlarmSnsTopic
      TreatMissingData: missing

Outputs:
  FunctionArn:
    Value: !GetAtt ServerHealthAlarmFunction.Arn
  AlarmName:
    Value: !Ref CpuAlarm
  SnsTopicArn:
    Value: !Ref AlarmSnsTopic
